<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Daily birth lottery — sourced prototype. One featured life per local day from a 10-country catalog, not the full world mix."
    />
    <title>Daily birth lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,560&family=Source+Sans+3:wght@400;600;650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=20260901-pppday" />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <p class="kicker">Sourced prototype · not the full world catalog</p>
        <h1>Daily birth lottery</h1>
        <p class="lede">
          One life per local day, drawn from the countries that have cards in this
          prototype — not the 185-country world mix.
        </p>
      </header>

      <section class="stats" aria-label="Local progress">
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak-value">0</span>
          <span class="stat-unit">days</span>
        </div>
        <div class="stat">
          <span class="stat-label">Lives met</span>
          <span class="stat-value" id="lives-value">0</span>
          <span class="stat-unit">unique</span>
        </div>
      </section>

      <div class="draw-row">
        <button type="button" class="draw" id="draw-btn">Draw</button>
        <p class="draw-hint" id="draw-hint">First draw of the day is the featured life.</p>
      </div>

      <p class="status" id="status" hidden></p>
      <div id="card-root"></div>
    </div>

    <template id="card-template">
      <article class="card">
        <div class="card-flags">
          <span class="badge badge-kind" data-kind></span>
          <span class="badge badge-proto">Sourced prototype</span>
        </div>
        <p class="card-date" data-date></p>
        <h2 class="card-country" data-country></h2>
        <p class="card-meta" data-meta></p>
        <p class="card-id" data-card-id></p>
        <dl class="facts">
          <div class="facts-stack">
            <dt>Income / consumption (2021 PPP $ per person per day)</dt>
            <dd data-field="income"></dd>
          </div>
          <div><dt>Education</dt><dd data-field="education"></dd></div>
          <div><dt>Occupation</dt><dd data-field="occupation"></dd></div>
          <div><dt>Household size</dt><dd data-field="household"></dd></div>
          <div><dt>Electricity</dt><dd data-field="electricity"></dd></div>
          <div><dt>Country HDI</dt><dd data-field="hdi"></dd></div>
          <div>
            <dt>Country life expectancy</dt>
            <dd>
              <span data-field="life_expectancy"></span>
              <span class="field-note">Country-level context, not remaining years of life.</span>
            </dd>
          </div>
        </dl>
        <section class="citations" aria-label="Citations">
          <h3>Citations</h3>
          <ul data-sources></ul>
        </section>
      </article>
    </template>

    <script src="js/lottery.js?v=20260901-pppday"></script>
    <script src="js/app.js?v=20260901-pppday"></script>
  </body>
</html>
