<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Daily birth lottery — sourced prototype. One featured life per local day from a 10-country catalog, not the full world mix."
    />
    <title>Daily birth lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,560&family=Source+Sans+3:wght@400;600;650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=20260903-goods" />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <p class="kicker">Sourced prototype · not the full world catalog</p>
        <h1>Daily birth lottery</h1>
        <p class="lede">
          One life per local day, drawn from the countries that have cards in this
          prototype — not the 185-country world mix.
        </p>
      </header>

      <section class="stats" aria-label="Local progress">
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak-value">0</span>
          <span class="stat-unit">days</span>
        </div>
        <div class="stat">
          <span class="stat-label">Lives met</span>
          <span class="stat-value" id="lives-value">0</span>
          <span class="stat-unit">unique</span>
        </div>
      </section>

      <div class="draw-row">
        <button type="button" class="draw" id="draw-btn">Draw</button>
        <p class="draw-hint" id="draw-hint">First draw of the day is the featured life.</p>
      </div>

      <p class="status" id="status" hidden></p>
      <div id="card-root"></div>
    </div>

    <template id="card-template">
      <article class="card">
        <div class="card-flags">
          <span class="badge badge-kind" data-kind></span>
          <span class="badge badge-proto">Sourced prototype</span>
        </div>
        <p class="card-date" data-date></p>
        <h2 class="card-country" data-country></h2>
        <p class="card-meta" data-meta></p>
        <p class="card-id" data-card-id></p>
        <figure class="card-art" data-art-figure hidden>
          <img data-art alt="" width="768" height="1024" />
          <figcaption>
            Colored-pencil sketch of this life, not a photograph and not a likeness of anyone real.
          </figcaption>
        </figure>
        <dl class="facts">
          <div class="facts-stack">
            <dt>Income / consumption (2021 PPP $ per person per day)</dt>
            <dd>
              <span data-field="income"></span>
              <p class="income-note" data-income-note></p>
              <div class="goods-ladder" data-goods hidden>
                <ul class="goods-row" role="list">
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        d="M4 11h16l-1.2 6.2a2 2 0 0 1-2 1.6H7.2a2 2 0 0 1-2-1.6L4 11zM8 11V9a4 4 0 0 1 8 0v2" />
                    </svg>
                    <span class="goods-label">Staple</span>
                  </li>
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <ellipse cx="12" cy="13" rx="8" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                        d="M5.2 11.4c.6-2.2 3.4-3.8 6.8-3.8s6.2 1.6 6.8 3.8" />
                    </svg>
                    <span class="goods-label">Healthy diet</span>
                  </li>
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        d="M3.5 11.5 12 4l8.5 7.5M6 10.8V20h12v-9.2" />
                    </svg>
                    <span class="goods-label">Home</span>
                  </li>
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        d="M4 16h13.5a2 2 0 0 0 2-2v-3.2L16.8 7H8.2L4 10.8V16zM7.2 16v1.8M16.2 16v1.8" />
                      <circle cx="8" cy="18.4" r="1.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                      <circle cx="16.5" cy="18.4" r="1.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    <span class="goods-label">Transport</span>
                  </li>
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        d="M6 5.5h10.5a1.5 1.5 0 0 1 1.5 1.5V19l-6-2.2L6 19V5.5z" />
                    </svg>
                    <span class="goods-label">School</span>
                  </li>
                  <li class="goods-item" data-good>
                    <svg class="goods-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        d="M7.2 10.2h9.6v7.2a3 3 0 0 1-3 3H10.2a3 3 0 0 1-3-3v-7.2zM9.4 10.2V8.6a2.6 2.6 0 1 1 5.2 0v1.6M12 13.6v2.2" />
                    </svg>
                    <span class="goods-label">Buffer</span>
                  </li>
                </ul>
                <p class="goods-caption">A day’s reach in this prototype, not a shopping list.</p>
              </div>
            </dd>
          </div>
          <div><dt>Education</dt><dd data-field="education"></dd></div>
          <div><dt>Occupation</dt><dd data-field="occupation"></dd></div>
          <div><dt>Household size</dt><dd data-field="household"></dd></div>
          <div><dt>Electricity</dt><dd data-field="electricity"></dd></div>
          <div><dt>Country HDI</dt><dd data-field="hdi"></dd></div>
          <div>
            <dt>Country life expectancy</dt>
            <dd>
              <span data-field="life_expectancy"></span>
              <span class="field-note">Country-level context, not remaining years of life.</span>
            </dd>
          </div>
        </dl>
        <details class="citations">
          <summary>Citations</summary>
          <ul data-sources></ul>
        </details>
      </article>
    </template>

    <script src="js/lottery.js?v=20260903-goods"></script>
    <script src="js/app.js?v=20260903-goods"></script>
  </body>
</html>
